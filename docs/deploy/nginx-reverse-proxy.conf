# Template Konfigurasi Nginx Reverse Proxy (HTTPS -> App Server)
# File ini dapat diberikan kepada Tim IT / Administrator Network.

server {
    listen 80;
    server_name silap-kinerja.bmkg.go.id; # Ganti dengan subdomain resmi
    return 301 https://$host$request_uri; # Redirect HTTP ke HTTPS
}

server {
    listen 443 ssl http2;
    server_name silap-kinerja.bmkg.go.id; # Ganti dengan subdomain resmi

    # Certificate SSL dari Tim IT
    ssl_certificate     /etc/ssl/certs/silap-kinerja.crt;
    ssl_certificate_key /etc/ssl/certs/silap-kinerja.key;

    # SSL hardening
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        proxy_pass http://127.0.0.1:8000; # Alamat aplikasi Laravel
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https; # Wajib agar Laravel tahu request asli adalah HTTPS
        proxy_set_header X-Forwarded-Port 443;
        
        # Support WebSocket / Inertia Hot Reloading (jika diperlukan)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Batas ukuran upload foto/bukti observasi cuaca (default misal 20M)
    client_max_body_size 20M;
}
